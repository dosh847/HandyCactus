schema_version = "1.0.0"

id = "handycactus"
version = "0.7.0"
name = "HandyCactus"
tagline = "Resin-style tree supports for FDM miniature printing"
maintainer = "dosh847"
type = "add-on"

website = "https://github.com/dosh847/HandyCactus"

tags = ["Mesh", "Geometry Nodes", "Import-Export"]

blender_version_min = "5.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Export the model and supports as 3MF or STL"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
]
